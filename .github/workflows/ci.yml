name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Playwright and its Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: index.html is exactly the src/ build
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Truth audit
        run: ruby scripts/truth_audit.rb
      - name: WebGL context loss and restore (real browser)
        run: npm run test:browser
      - name: Logic and progression gates, 5 seeds
        run: node sim.mjs --seeds 1-5 --render 0 --gates
      - name: Discovery-world gates, 5 seeds
        run: node sim.mjs --seeds 1-5 --render 0 --gates --theme all
